version: '3.8'

services:
  sharenear-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    networks:
      - sharenear-network

  sharenear-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
    networks:
      - sharenear-network
    profiles:
      - production

networks:
  sharenear-network:
    driver: bridge