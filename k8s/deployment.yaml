apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharenear
  labels:
    app: sharenear
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sharenear
  template:
    metadata:
      labels:
        app: sharenear
    spec:
      containers:
      - name: sharenear
        image: sharenear:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        envFrom:
        - secretRef:
            name: sharenear-secrets
        - configMapRef:
            name: sharenear-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: uploads
          mountPath: /tmp/uploads
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: sharenear-uploads

---
apiVersion: v1
kind: Service
metadata:
  name: sharenear-service
spec:
  selector:
    app: sharenear
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sharenear-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10g"
spec:
  tls:
  - hosts:
    - yourdomain.com
    secretName: sharenear-tls
  rules:
  - host: yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sharenear-service
            port:
              number: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sharenear-uploads
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sharenear-config
data:
  MAX_FILE_SIZE: "10737418240"
  UPLOAD_DIR: "/tmp/uploads"
  ALLOWED_FILE_TYPES: "*"
  STUN_SERVERS: "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  ENABLE_ANALYTICS: "false"
  ENABLE_FILE_ENCRYPTION: "true"
  DEBUG: "false"
  LOG_LEVEL: "info"

---
apiVersion: v1
kind: Secret
metadata:
  name: sharenear-secrets
type: Opaque
stringData:
  SESSION_SECRET: "your-super-secret-session-key-here"
  JWT_SECRET: "your-jwt-secret-key-here"
  # Add other secrets as needed